<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博客与思考</title>
<meta name="description" content="个人博客与思考记录。">
<style>
  /* ===== 主题变量 ===== */
  :root {
    --bg: #f7f8fa;
    --surface: #ffffff;
    --surface-2: #f1f3f7;
    --text: #14181f;
    --muted: #6b7280;
    --border: #e6e8ee;
    --accent: #6366f1;
    --accent-2: #8b5cf6;
    --grad: linear-gradient(135deg, #6366f1, #8b5cf6);
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
    --shadow-hover: 0 2px 6px rgba(99,102,241,.10), 0 18px 40px rgba(16,24,40,.12);
    --radius: 16px;
  }
  [data-theme="dark"] {
    --bg: #0b0f17;
    --surface: #121826;
    --surface-2: #1a2233;
    --text: #e6e9ef;
    --muted: #93a0b4;
    --border: #232c3d;
    --accent: #818cf8;
    --accent-2: #a78bfa;
    --grad: linear-gradient(135deg, #818cf8, #a78bfa);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --shadow-hover: 0 2px 6px rgba(129,140,248,.18), 0 18px 40px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    transition: background .3s ease, color .3s ease;
  }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }

  /* ===== 顶栏 ===== */
  header.nav {
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
  .brand .dot {
    width: 26px; height: 26px; border-radius: 8px; background: var(--grad);
    box-shadow: 0 4px 10px rgba(99,102,241,.35);
  }
  .nav-links { display: flex; align-items: center; gap: 6px; }
  .nav-links a, .icon-btn {
    padding: 8px 12px; border-radius: 10px; color: var(--muted);
    font-size: 14px; font-weight: 500; transition: all .2s ease; cursor: pointer;
    background: transparent; border: none; color: var(--muted);
  }
  .nav-links a:hover, .icon-btn:hover { color: var(--text); background: var(--surface-2); }
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; }

  /* ===== Hero ===== */
  .hero { position: relative; padding: 84px 0 56px; overflow: hidden; }
  .hero::before {
    content: ""; position: absolute; inset: -40% 20% auto -10%; height: 460px;
    background: radial-gradient(closest-side, rgba(99,102,241,.22), transparent 70%),
                radial-gradient(closest-side, rgba(139,92,246,.18), transparent 70%) 30% 40%;
    filter: blur(20px); z-index: -1; pointer-events: none;
  }
  .hero h1 { font-size: clamp(34px, 6vw, 56px); line-height: 1.08; margin: 0 0 18px; letter-spacing: -.02em; font-weight: 800; }
  .hero h1 .grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p.lead { font-size: 18px; color: var(--muted); max-width: 640px; margin: 0 0 28px; }
  .hero-cta { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 12px;
    font-size: 14px; font-weight: 600; transition: all .2s ease; border: 1px solid transparent;
  }
  .btn-primary { background: var(--grad); color: #fff; box-shadow: 0 8px 20px rgba(99,102,241,.32); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(99,102,241,.4); }
  .btn-ghost { background: var(--surface); border-color: var(--border); color: var(--text); }
  .btn-ghost:hover { transform: translateY(-2px); border-color: var(--accent); color: var(--accent); }

  /* ===== 博客区 ===== */
  section.blog { padding: 24px 0 80px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 22px; flex-wrap: wrap; gap: 12px; }
  .section-head h2 { font-size: 26px; margin: 0; font-weight: 800; letter-spacing: -.01em; }
  .section-head .count { color: var(--muted); font-size: 14px; }

  .toolbar { display: flex; flex-direction: column; gap: 14px; margin-bottom: 26px; }
  .search { position: relative; }
  .search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .search input {
    width: 100%; padding: 14px 16px 14px 46px; font-size: 15px; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; outline: none;
    transition: border-color .2s, box-shadow .2s; font-family: inherit;
  }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
  .search .kbd { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px; background: var(--surface-2); }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 500; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border); color: var(--muted); transition: all .18s ease;
  }
  .chip:hover { color: var(--text); border-color: var(--accent); }
  .chip.active { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 4px 12px rgba(99,102,241,.3); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 20px; }
  .card {
    display: flex; flex-direction: column; justify-content: space-between; gap: 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 22px; box-shadow: var(--shadow); transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    position: relative; overflow: hidden;
  }
  .card::after { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--grad); opacity: 0; transition: opacity .22s ease; }
  .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
  .card:hover::after { opacity: 1; }
  .card .meta { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .card .meta .date { display: inline-flex; align-items: center; gap: 6px; }
  .card h3 { font-size: 18px; margin: 0; line-height: 1.4; font-weight: 700; }
  .card .desc { color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin: 0; }
  .card .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .card .tag { font-size: 12px; padding: 3px 9px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
  .card .read { font-size: 14px; font-weight: 600; color: var(--accent); display: inline-flex; align-items: center; gap: 6px; transition: gap .2s ease; }
  .card:hover .read { gap: 10px; }

  .empty { text-align: center; padding: 70px 20px; color: var(--muted); }
  .empty svg { margin-bottom: 14px; }
  .skeleton { height: 200px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); }

  footer { border-top: 1px solid var(--border); padding: 28px 0; color: var(--muted); font-size: 13px; }
  footer .wrap { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }

  @media (max-width: 600px) {
    .nav-links a.label { display: none; }
    .hero { padding: 56px 0 40px; }
  }
</style>
</head>
<body>
<header class="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="./">
      <span class="dot"></span>
      <span>博客与思考</span>
    </a>
    <nav class="nav-links">
      <a href="#blog" class="label">博客</a>
      <button class="icon-btn" id="themeToggle" title="切换主题" aria-label="切换主题">
        <svg id="iconSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg id="iconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <h1>记录思考，<span class="grad">沉淀所想</span></h1>
    <p class="lead">这里是我的个人博客与思考空间，记录一些想法与笔记。</p>
    <div class="hero-cta">
      <a class="btn btn-primary" href="#blog">阅读博客
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </div>
  </div>
</section>

<section class="blog" id="blog">
  <div class="wrap">
    <div class="section-head">
      <h2>博客与思考</h2>
      <span class="count" id="count"></span>
    </div>
    <div class="toolbar">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="search" type="text" placeholder="搜索文章标题或内容…" autocomplete="off" />
        <span class="kbd">/</span>
      </div>
      <div class="filters" id="filters"></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <div>没有找到匹配的文章</div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <span>© <span id="year"></span> 博客与思考</span>
    <span>由 GitHub Pages 提供托管</span>
  </div>
</footer>

<script>
(function () {
  "use strict";
  // ===== 主题切换 =====
  var root = document.documentElement;
  var themeBtn = document.getElementById('themeToggle');
  var iconSun = document.getElementById('iconSun');
  var iconMoon = document.getElementById('iconMoon');
  function applyTheme(t) {
    root.setAttribute('data-theme', t);
    iconSun.style.display = t === 'dark' ? 'block' : 'none';
    iconMoon.style.display = t === 'dark' ? 'none' : 'block';
  }
  var saved = null;
  try { saved = localStorage.getItem('theme'); } catch (e) {}
  applyTheme(saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  themeBtn.addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem('theme', next); } catch (e) {}
  });

  document.getElementById('year').textContent = new Date().getFullYear();

  // ===== 数据加载与渲染 =====
  var grid = document.getElementById('grid');
  var empty = document.getElementById('empty');
  var countEl = document.getElementById('count');
  var filtersEl = document.getElementById('filters');
  var searchInput = document.getElementById('search');

  var state = { query: '', tag: null, posts: [] };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function formatDate(d) {
    if (!d) return '';
    var parts = String(d).slice(0, 10).split('-');
    if (parts.length === 3) return parts[0] + '年' + Number(parts[1]) + '月' + Number(parts[2]) + '日';
    return d;
  }

  function buildTags(posts) {
    var set = {};
    posts.forEach(function (p) { (p.tags || []).forEach(function (t) { set[t] = true; }); });
    return Object.keys(set).sort(function (a, b) { return a.localeCompare(b, 'zh'); });
  }

  function renderFilters() {
    var tags = buildTags(state.posts);
    filtersEl.innerHTML = '';
    if (!tags.length) { filtersEl.style.display = 'none'; return; }
    filtersEl.style.display = 'flex';
    var all = document.createElement('button');
    all.className = 'chip' + (state.tag === null ? ' active' : '');
    all.textContent = '全部';
    all.addEventListener('click', function () { state.tag = null; render(); });
    filtersEl.appendChild(all);
    tags.forEach(function (t) {
      var b = document.createElement('button');
      b.className = 'chip' + (state.tag === t ? ' active' : '');
      b.textContent = t;
      b.addEventListener('click', function () { state.tag = (state.tag === t ? null : t); render(); });
      filtersEl.appendChild(b);
    });
  }

  function render() {
    renderFilters();
    var q = state.query.trim().toLowerCase();
    var list = state.posts.filter(function (p) {
      var matchQ = !q || (p.title || '').toLowerCase().indexOf(q) > -1 ||
        (p.description || '').toLowerCase().indexOf(q) > -1 ||
        (p.tags || []).some(function (t) { return t.toLowerCase().indexOf(q) > -1; });
      var matchT = !state.tag || (p.tags || []).indexOf(state.tag) > -1;
      return matchQ && matchT;
    });

    countEl.textContent = list.length ? '共 ' + list.length + ' 篇' : '';
    grid.innerHTML = '';

    if (!list.length) {
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    list.forEach(function (p) {
      var a = document.createElement('a');
      a.className = 'card';
      a.href = p.url;
      var html = '<div class="meta"><span class="date">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>' +
        escapeHtml(formatDate(p.date)) + '</span></div>';
      html += '<h3>' + escapeHtml(p.title) + '</h3>';
      if (p.description) html += '<p class="desc">' + escapeHtml(p.description) + '</p>';
      if (p.tags && p.tags.length) {
        html += '<div class="tags">' + p.tags.map(function (t) {
          return '<span class="tag">' + escapeHtml(t) + '</span>';
        }).join('') + '</div>';
      }
      html += '<span class="read">阅读全文 <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>';
      a.innerHTML = html;
      grid.appendChild(a);
    });
  }

  function renderSkeleton() {
    grid.innerHTML = '';
    for (var i = 0; i < 3; i++) {
      var d = document.createElement('div');
      d.className = 'skeleton';
      grid.appendChild(d);
    }
  }

  function load() {
    renderSkeleton();
    fetch('manifest.json', { cache: 'no-cache' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        state.posts = (data && data.posts) || [];
        // 客户端兜底排序：日期倒序
        state.posts.sort(function (a, b) {
          if (a.date && b.date) return b.date.localeCompare(a.date);
          if (a.date) return -1;
          if (b.date) return 1;
          return (a.file || '').localeCompare(b.file || '');
        });
        render();
      })
      .catch(function () {
        grid.innerHTML = '';
        empty.style.display = 'block';
        empty.querySelector('div').textContent = '文章列表加载失败，请稍后重试。';
      });
  }

  // 搜索（防抖）
  var timer = null;
  searchInput.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(function () { state.query = searchInput.value; render(); }, 120);
  });
  // "/" 聚焦搜索
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== searchInput) {
      e.preventDefault();
      searchInput.focus();
    }
  });

  load();
})();
</script>
</body>
</html>
