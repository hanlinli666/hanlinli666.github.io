<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="今日精进">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2a72"/>
      <stop offset=".45" stop-color="#141a3f"/>
      <stop offset="1" stop-color="#05060e"/>
    </linearGradient>
    <radialGradient id="nebulaA" cx=".18" cy=".14" r=".72">
      <stop offset="0" stop-color="#8f8ff8" stop-opacity=".30"/>
      <stop offset="1" stop-color="#8f8ff8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx=".80" cy=".78" r=".62">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="planet" x1=".22" y1=".05" x2=".78" y2="1">
      <stop offset="0" stop-color="#b6f7ff"/>
      <stop offset=".38" stop-color="#63a8f8"/>
      <stop offset=".75" stop-color="#3b43b0"/>
      <stop offset="1" stop-color="#1d1f57"/>
    </linearGradient>
    <radialGradient id="shade" cx=".74" cy=".82" r=".88">
      <stop offset=".30" stop-color="#040516" stop-opacity="0"/>
      <stop offset="1" stop-color="#040516" stop-opacity=".78"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a7efff" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8f9dff" stop-opacity=".85"/>
    </linearGradient>
    <radialGradient id="starGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="planetClip">
      <circle cx="32" cy="35" r="12.6"/>
    </clipPath>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <filter id="sparkGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="bg">
    <rect width="64" height="64" rx="15" fill="url(#space)"/>
    <rect width="64" height="64" rx="15" fill="url(#nebulaA)"/>
    <rect width="64" height="64" rx="15" fill="url(#nebulaB)"/>
  </g>

  <g id="stars" fill="#ffffff">
    <circle cx="11" cy="14.5" r=".55" opacity=".75"/>
    <circle cx="18.5" cy="45" r=".45" opacity=".55"/>
    <circle cx="9.5" cy="54" r=".5" opacity=".45"/>
    <circle cx="24" cy="9.5" r=".4" opacity=".5"/>
    <circle cx="39" cy="55.5" r=".45" opacity=".45"/>
    <circle cx="56.5" cy="51" r=".5" opacity=".55"/>
    <circle cx="60" cy="34" r=".4" opacity=".4"/>
    <circle cx="44.5" cy="6.5" r=".45" opacity=".5"/>
    <circle cx="6.5" cy="33" r=".4" opacity=".4"/>
    <circle cx="29.5" cy="60" r=".35" opacity=".35"/>
    <circle cx="50" cy="57" r=".35" opacity=".4"/>
    <circle cx="14" cy="27" r=".35" opacity=".35"/>
  </g>

  <g id="mark">
    <!-- ring behind the planet -->
    <g transform="rotate(-17 32 35)">
      <ellipse cx="32" cy="35" rx="25.6" ry="7.6" fill="none" stroke="#a7efff"
               stroke-opacity=".18" stroke-width=".9"/>
      <path d="M9 35 A23 6.6 0 0 1 55 35" fill="none" stroke="url(#ring)"
            stroke-width="3.1" stroke-linecap="round"/>
    </g>

    <!-- planet -->
    <circle cx="32" cy="35" r="12.6" fill="url(#planet)"/>
    <g clip-path="url(#planetClip)">
      <path d="M19.5 30.6 Q32 34.2 44.5 30.6" fill="none" stroke="#eafcff"
            stroke-opacity=".22" stroke-width="1.3"/>
      <path d="M18.6 37.8 Q32 43 45.4 37.8" fill="none" stroke="#eafcff"
            stroke-opacity=".15" stroke-width="1.1"/>
      <circle cx="32" cy="35" r="12.6" fill="url(#shade)"/>
      <ellipse cx="26.5" cy="28.5" rx="5.6" ry="3.6" fill="#ffffff" opacity=".16" filter="url(#soft)"/>
    </g>
    <circle cx="32" cy="35" r="12.6" fill="none" stroke="#d8fbff" stroke-opacity=".5"
            stroke-width=".75"/>

    <!-- ring in front of the planet -->
    <g transform="rotate(-17 32 35)">
      <path d="M9 35 A23 6.6 0 0 0 55 35" fill="none" stroke="url(#ring)"
            stroke-width="3.1" stroke-linecap="round"/>
      <ellipse cx="32" cy="35" rx="25.6" ry="7.6" fill="none" stroke="#a7efff"
               stroke-opacity=".18" stroke-width=".9"/>
    </g>

    <!-- small explorer on the ring -->
    <g filter="url(#sparkGlow)">
      <circle cx="53.4" cy="30.3" r="2.9" fill="url(#starGlow)" opacity=".55"/>
      <circle cx="53.4" cy="30.3" r="1.35" fill="#ffffff"/>
    </g>

    <!-- curiosity spark -->
    <g filter="url(#sparkGlow)" fill="#ffffff">
      <path d="M47.8 13.4c.5 2.7 1.1 3.3 3.8 3.8-2.7.5-3.3 1.1-3.8 3.8-.5-2.7-1.1-3.3-3.8-3.8 2.7-.5 3.3-1.1 3.8-3.8Z"/>
    </g>
  </g>
</svg>
