<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>今日精进 · 论文与新闻</title>
<meta name="description" content="每天一份 AI 论文与科技新闻摘要，自动更新、离线可读、可安装到主屏幕。" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<link rel="stylesheet" href="./assets/app.css" />
<meta name="theme-color" content="#f7f7fb" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0e1016" media="(prefers-color-scheme: dark)" />
<meta name="color-scheme" content="light dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="今日精进" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="format-detection" content="telephone=no" />
<script>
  // Apply the saved theme before first paint to avoid a flash of the wrong colour.
  try {
    var t = localStorage.getItem('dl.theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>

<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

<!-- 第一屏的品牌区：随页面正常滚走 -->
<header class="app-head">
  <div class="head-row">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <path d="M7 24V13M16 24V8M25 24v-6" />
        </svg>
      </div>
      <div class="brand-text">
        <h1>今日精进</h1>
        <p id="today-label">正在加载…</p>
      </div>
    </div>
    <div class="head-tools">
      <button id="btn-install" class="icon-btn" type="button" title="安装到主屏幕" aria-label="安装到主屏幕" hidden>
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      </button>
      <button id="btn-theme" class="icon-btn" type="button" title="切换深浅色" aria-label="切换深浅色">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
      <button id="btn-refresh" class="icon-btn" type="button" title="重新拉取数据" aria-label="重新拉取数据">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg>
      </button>
    </div>
  </div>

  <div class="stats" id="stats" aria-live="polite">
    <span class="stat"><b id="st-papers">–</b><span>今日论文</span></span>
    <span class="stat"><b id="st-news">–</b><span>今日新闻</span></span>
    <span class="stat"><b id="st-read">0</b><span>已读</span></span>
    <span class="stat"><b id="st-streak">1</b><span>连续打卡</span></span>
  </div>
</header>

<!-- 常驻栏：标签 + 搜索。sticky 定位、高度恒定，滚动时不改变任何布局 -->
<div class="app-bar">
  <nav class="tabs" role="tablist" aria-label="内容分类">
    <button class="tab" role="tab" data-tab="papers" aria-selected="true">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5Z"/><path d="M4 20.5V5.5"/></svg>
      论文
    </button>
    <button class="tab" role="tab" data-tab="news" aria-selected="false">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h13v14H5.5A1.5 1.5 0 0 1 4 17.5Z"/><path d="M17 8h2.5A1.5 1.5 0 0 1 21 9.5v8a1.5 1.5 0 0 1-1.5 1.5H17"/><path d="M7 8h7M7 11.5h7M7 15h4"/></svg>
      新闻
    </button>
    <button class="tab" role="tab" data-tab="saved" aria-selected="false">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m12 4 2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4L4.2 9.7l5.4-.8Z"/></svg>
      收藏
    </button>
  </nav>

  <div class="toolbar">
    <label class="search">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" inputmode="search" autocomplete="off" placeholder="搜索标题、摘要、来源…" aria-label="搜索" />
      <button id="search-clear" class="clear" type="button" aria-label="清空搜索" hidden>&times;</button>
    </label>
    <div class="sort" id="sort-wrap">
      <button id="btn-sort" class="sort-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
        <span id="sort-label">最新</span>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="sort-menu" id="sort-menu" role="listbox" hidden>
        <button role="option" data-sort="date" aria-selected="true">最新发布</button>
        <button role="option" data-sort="score" aria-selected="false">相关度</button>
      </div>
    </div>
  </div>
</div>

<div class="chips" id="keyword-chips" hidden></div>

<main id="main" tabindex="-1">
  <div id="result-info" class="result-info" aria-live="polite"></div>
  <div id="list" class="list"></div>
  <div id="empty" class="empty" hidden>
    <div class="empty-ico" aria-hidden="true">✦</div>
    <h2 id="empty-title">没有内容</h2>
    <p id="empty-text">试试换一个关键词，或者明天再来看看。</p>
  </div>
  <div id="skeleton" class="skeleton" hidden>
    <div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>
  </div>
</main>

<footer class="app-foot">
  <p id="foot-meta">数据由 GitHub Actions 每天自动生成</p>
  <p class="foot-links">
    <a href="../" target="_blank" rel="noopener">← 回博客</a>
    <span>·</span>
    <a href="https://arxiv.org/" target="_blank" rel="noopener">arXiv</a>
    <span>·</span>
    <a href="./data/papers.json" target="_blank" rel="noopener">papers.json</a>
    <span>·</span>
    <a href="./data/news.json" target="_blank" rel="noopener">news.json</a>
  </p>
</footer>

<div id="ios-tip" class="sheet" hidden>
  <div class="sheet-card">
    <h3>安装到主屏幕</h3>
    <ol>
      <li>点击 Safari 底部的 <b>分享</b> 按钮</li>
      <li>向下滑动，选择 <b>添加到主屏幕</b></li>
      <li>点击右上角 <b>添加</b>，从桌面图标打开即可全屏使用</li>
    </ol>
    <button id="ios-close" class="btn primary" type="button">知道了</button>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<noscript><p style="padding:24px;text-align:center">这个页面需要 JavaScript 才能显示内容。</p></noscript>

<script src="./assets/app.js" defer></script>
</body>
</html>
